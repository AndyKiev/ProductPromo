# Catalog (master data) service: FastAPI backend. Postgres is NOT in here.
# The SPA lives in ../web, the promo service in ../promo; each starts on its own.
#
# The database is a native Windows cluster on the host —
# C:\Users\andre\PostgresData\product_promo, port 5435 — so no `docker` command
# can ever destroy it, and it matches production, where the DB is an external
# server. Start it before this stack (`make db-up`); it is not a Windows
# service, so it does not come back on its own after a reboot.
#
#   make db-up                     # start the host Postgres first
#   docker compose up --build -d   # first run
#   docker compose up -d           # after that
#
# See docs/DB_MIGRATION.md for how the data got there and how to operate it.
#
# The old `productpromo_postgres_data` volume still holds the pre-migration
# copy of the data. Delete it only once you are sure.
#
# There is no nginx service any more: the host's port 80 belongs to talent's
# nginx, and with the backend published directly the SPA has nothing to proxy
# through. nginx.conf and the root Dockerfile are left in the repo, unused.
name: catalog

networks:
  # Private to this project. Other catalog projects (promo, web) never
  # share a network with it: backends talk only through RabbitMQ (../broker).
  catalog:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Fetches the private pp-common git dependency with your WSL GitHub key.
      ssh:
        - default=${HOME}/.ssh/id_rsa
    container_name: catalog-backend
    # Dev stack: no auto-start after a reboot — the file watchers poll (and cost
    # CPU) even when nobody is working on this project. Start it by hand with
    # `docker compose up -d`; pause with `docker compose stop`.
    restart: "no"
    env_file:
      - stack.env
    # 127.0.0.1 inside a container is the container, not the host, so the
    # host cluster is reached through the gateway alias.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Reach the host's native Postgres. It has listen_addresses='*' and
      # pg_hba lines for the Docker subnets (172.16.0.0/12, 192.168.65.0/24).
      # Real env vars beat the values in stack.env, which say 127.0.0.1 —
      # correct for native dev, meaningless inside a container.
      APP_CONFIG__DB__HOST: host.docker.internal
      APP_CONFIG__DB__PORT: "5435"
      # Bind all interfaces so the published port is reachable.
      APP_CONFIG__RUN__HOST: 0.0.0.0
      APP_CONFIG__RUN__PORT: "8004"
      # Auto-reload on edits (the bind mount below). The source lives on the
      # WSL2 filesystem, so inotify events reach the container and watchfiles
      # needs no polling — do not add WATCHFILES_FORCE_POLLING back.
      APP_CONFIG__RUN__RELOAD: "true"
      # RabbitMQ (../broker, published on the host). Optional at startup: the
      # service connects in the background and retries.
      APP_CONFIG__BROKER__HOST: host.docker.internal
    ports:
      # 8012 on the host, not 8004: talent publishes 8005 and anee_data 8006,
      # and 8004 / 8009 are already taken by native dev servers here. Inside
      # the container the app still listens on 8004, so only the host moved.
      - "8012:8004"
    volumes:
      # Live source for reloads. Only the package dir is mounted, so the host's
      # Windows backend/.venv is never exposed — do NOT add an anonymous
      # `/app/backend/.venv` volume to mask it: the empty directory that
      # creates is picked up by poetry as an in-project venv, and every
      # `poetry run` then fails with ModuleNotFoundError.
      - ./backend/backend:/app/backend/backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8004/openapi.json > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [catalog]

  # This app's own frontend (React, Vite dev server with HMR): http://127.0.0.1:8013
  # It talks only to this project's backend. The browser runs on the host, so it calls the
  # backend on its published port.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Fetches the private @catalog/ui git dependency with your WSL GitHub key.
      ssh:
        - default=${HOME}/.ssh/id_rsa
    container_name: catalog-frontend
    restart: "no"
    ports:
      # The container serves 8009 (frontend/vite.config.ts).
      - "8013:8009"
    volumes:
      - ./frontend:/app
      # Keep the image's Linux node_modules; the bind mount would expose the host's.
      - /app/node_modules
    environment:
      VITE_API_URL: http://127.0.0.1:8012
      VITE_IN_DOCKER: "true"
