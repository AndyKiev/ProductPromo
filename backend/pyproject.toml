[tool.poetry]
name = "productpromo"
version = "0.1.0"
description = "ProductPromo — product card & promotions back-office (FastAPI, legacy MySQL)"
authors = ["Andrey Bakulin <abakulin@auchan.ua>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = { extras = ["standard"], version = ">=0.117.1,<0.118.0" }
uvicorn = { extras = ["standard"], version = ">=0.37.0,<0.38.0" }
sqlalchemy = ">=2.0.43,<3.0.0"
aiomysql = ">=0.2.0,<0.3.0"
asyncpg = ">=0.29.0,<1.0.0"
cryptography = ">=43.0.0"            # MySQL 8 caching_sha2_password auth
pydantic = { extras = ["email"], version = "^2.12.3" }
pydantic-settings = ">=2.11.0,<3.0.0"
orjson = "^3.11.8"
pyjwt = "^2.9.0"
# --- add when porting real auth/i18n from talent ---
# ldap3 = ">=2.9.1,<3.0.0"
# redis = ">=5.0.0,<6.0.0"
openpyxl = "^3.1.5"

[dependency-groups]
dev = ["black (>=25.9.0,<26.0.0)", "pytest (>=9.0.1,<10.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
